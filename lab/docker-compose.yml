name: vbox-vmdk-sparse-extent

services:
  gadget:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: "no"
    working_dir: /lab
    environment:
      PYTHONUNBUFFERED: "1"
      LABEL: "vbox-vmdk-sparse-extent"
      WITNESS: "VBOX-VMDK-SPARSE-EXTENT-WITNESS"
    ports:
      - "127.0.0.1:19250:19250"
    labels:
      lab: vbox-vmdk-sparse-extent
